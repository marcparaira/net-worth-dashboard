[project]
name = "net-worth-dashboard"
version = "0.1.0"
description = ""
authors = [
    {name = "Marc Paraira"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6", 
    "uvicorn[standard]==0.34.0", 
    "PyYAML==6.0.2", 
    "pydantic==2.13.4",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.basedpyright]
venvPath = "."
venv = ".venv"

include = ["backend"]
pythonVersion = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Defaults plus import sorting, bug-prone patterns, pyupgrade and simplifications.
extend-select = ["I", "B", "UP", "SIM", "RUF"]
# Pydantic models copy mutable defaults, so class-level list defaults are safe.
ignore = ["RUF012"]

[tool.ruff.format]
# The code base mixes single and double quotes; keep them as written.
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
# anyio (via FastAPI) registers a plugin that uses a deprecated pytest API; no async tests need it.
addopts = "-p no:anyio"
