name: PR title

# The PR title becomes the squash-merge commit on main, which decides the next release
# version, so it must follow Conventional Commits (feat: ..., fix: ..., docs: ...).
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
