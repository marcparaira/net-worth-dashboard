name: CI

# Pull requests, and main after each merge (feature-branch pushes are covered by their PR).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, format, types, tests)
    runs-on: ubuntu-24.04
    # Database tests run against a real PostgreSQL, the same major version as production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: networth
          POSTGRES_PASSWORD: networth
          POSTGRES_DB: networth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U networth -d networth_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://networth:networth@localhost:5432/networth_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Same virtual environment as local development; basedpyright is configured to use .venv.
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/basedpyright
      - run: .venv/bin/pytest
      - name: Check that the migrations match the models
        run: .venv/bin/alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: postgresql+psycopg://networth:networth@localhost:5432/networth_test

  frontend:
    name: Frontend (lint, format, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check design token contrast and colour-blind safety
        run: python3 ../scripts/check_design_tokens.py

  images:
    name: Container images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: podman build -f backend/Containerfile --target runtime -t net-worth-api .
      - name: Build web images (dev server and production build)
        run: |
          podman build --target dev -t net-worth-web frontend
          podman build --target build frontend
      - name: Smoke-test the API image with PostgreSQL and the sample data
        env:
          DATABASE_URL: postgresql+psycopg://networth:networth@localhost:5432/networth
        run: |
          # A pod shares localhost between the database and the API containers.
          podman pod create --name smoke -p 8000:8000
          podman run -d --pod smoke --name db -e POSTGRES_USER=networth -e POSTGRES_PASSWORD=networth \
            -e POSTGRES_DB=networth docker.io/library/postgres:17-alpine
          podman run --rm --pod smoke -e DATABASE_URL net-worth-api python -m backend.migrate
          podman run --rm --pod smoke -e DATABASE_URL net-worth-api python -m backend.importer
          podman run -d --pod smoke --name api -e DATABASE_URL net-worth-api
          curl -sf --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/api/dashboard > /dev/null
          curl -sf http://127.0.0.1:8000/api/rebalancing > /dev/null
      - name: API logs
        if: always()
        run: podman logs api || true
